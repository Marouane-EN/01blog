@if (ui.confirmState(); as state) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
      <h3 class="modal-title" id="adminModalTitle">{{ state.title }}</h3>
      <p class="modal-desc">{{ state.description }}</p>
      <div class="modal-actions">
        <button class="btn-sm-outline" type="button" (click)="ui.resolveConfirm(false)">
          Cancel
        </button>
        <button
          [class]="state.danger === false ? 'btn-sm-outline' : 'btn-sm-danger'"
          type="button"
          (click)="ui.resolveConfirm(true)"
        >
          {{ state.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}

<div class="toast" [class.is-visible]="ui.toastMessage()">{{ ui.toastMessage() }}</div>
