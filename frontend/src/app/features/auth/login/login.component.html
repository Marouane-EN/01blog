<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Welcome to 01Blog</mat-card-title>
      <mat-card-subtitle>A community of developers</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="error-alert" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username or Email</mat-label>
          <input
            matInput
            formControlName="identifier"
            placeholder="Enter your username or email"
          />
          <mat-error *ngIf="loginForm.controls.identifier.hasError('required')">
            Username or email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.controls.password.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-button"
          [disabled]="loginForm.invalid || isLoading"
        >
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Log In</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </mat-card-footer>
  </mat-card>
</div>
