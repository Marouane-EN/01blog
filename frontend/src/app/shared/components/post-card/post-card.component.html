<article class="post-card">
  <aside class="card-action-rail" aria-label="Post actions">
    <button
      mat-icon-button
      type="button"
      class="rail-btn"
      (click)="toggleLike($event)"
      [class.active-like]="post.likedByCurrentUser"
      aria-label="Like post"
    >
      <mat-icon>{{ post.likedByCurrentUser ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
    <span>{{ post.totalLikes }}</span>

    <a
      mat-icon-button
      class="rail-btn"
      [routerLink]="['/posts', post.slug]"
      fragment="comments"
      aria-label="View comments"
    >
      <mat-icon>chat_bubble_outline</mat-icon>
    </a>
    <span>{{ post.totalComments }}</span>
  </aside>

  <div class="card-content">
    <div class="post-header">
      <a [routerLink]="['/profile', post.author.username]" class="author-meta">
        <img
          [src]="post.author.profileImageUrl || 'assets/default-avatar.png'"
          alt="Author avatar"
          class="author-avatar"
        />
        <div class="author-info">
          <span class="author-name">{{ post.author.username }}</span>
          <span class="publish-date">{{ post.createAt | date: 'MMM d' }}</span>
        </div>
      </a>

      @if (isOwnPost()) {
        <button mat-icon-button type="button" [matMenuTriggerFor]="postMenu" aria-label="Post options">
          <mat-icon>more_horiz</mat-icon>
        </button>

        <mat-menu #postMenu="matMenu" xPosition="before">
          <a mat-menu-item [routerLink]="['/posts', post.slug]" [queryParams]="{ edit: true }">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </a>
          <button mat-menu-item type="button" (click)="deletePost($event)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      }
    </div>

    <div class="post-body">
      <h2 class="post-title">
        <a [routerLink]="['/posts', post.slug]">{{ post.title }}</a>
      </h2>

      @if (post.content) {
        <p class="post-preview">{{ post.content }}</p>
      }
    </div>
  </div>
</article>
