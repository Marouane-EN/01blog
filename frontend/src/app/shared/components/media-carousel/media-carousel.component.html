@if (items.length) {
  <div class="media-carousel">
    <button
      type="button"
      class="carousel-arrow"
      [disabled]="items.length < 2"
      (click)="previous()"
      aria-label="Previous file"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>

    <div class="carousel-slide">
      @if (activeItem; as active) {
        @if (active.kind === 'video') {
          <video [src]="active.url" controls preload="metadata"></video>
        } @else {
          <img [src]="active.url" [alt]="active.label || 'Post media'" loading="lazy" />
        }

        @if (removable) {
          <button
            type="button"
            class="carousel-remove"
            (click)="removeActive()"
            aria-label="Remove this file"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        }

        @if (active.label) {
          <p class="carousel-filename" [title]="active.label">{{ active.label }}</p>
        }
      }
    </div>

    <button
      type="button"
      class="carousel-arrow"
      [disabled]="items.length < 2"
      (click)="next()"
      aria-label="Next file"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  @if (items.length > 1) {
    <div class="carousel-dots">
      @for (item of items; track item.url; let i = $index) {
        <button
          type="button"
          class="carousel-dot"
          [class.is-active]="i === activeIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'Go to file ' + (i + 1)"
        ></button>
      }
    </div>
    <p class="carousel-counter">{{ activeIndex + 1 }} / {{ items.length }}</p>
  }
}
