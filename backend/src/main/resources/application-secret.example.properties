# =============================================================================
# application-secret.properties  (EXAMPLE FILE)
#
# HOW TO USE
#   1. Copy this file to:  backend/src/main/resources/application-secret.properties
#   2. Replace every <placeholder> with your real value.
#   3. NEVER commit the real file (it is already listed in .gitignore).
#
# application.properties loads this file with `spring.profiles.include=secret`
# and reads each value through a placeholder such as ${DB_URL}.
# The same names also work as environment variables (useful for Docker / CI / production).
# =============================================================================

# --- DATABASE (must match backend/compose.yaml) ------------------------------
# Host port is 5433 (mapped to 5432 inside the container); database name is blog_db.
DB_URL=jdbc:postgresql://localhost:5433/blog_db
DB_USERNAME=admin
DB_PASSWORD=<same value as POSTGRES_PASSWORD in compose.yaml>

# --- GOOGLE OAUTH2 -----------------------------------------------------------
# Google Cloud Console > APIs & Services > Credentials > OAuth client ID (Web application)
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
GOOGLE_CLIENT_ID=<your-google-client-id>.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET=<your-google-client-secret>

# --- GITHUB OAUTH2 -----------------------------------------------------------
# GitHub > Settings > Developer settings > OAuth Apps > New OAuth App
# Homepage URL:                http://localhost:4200
# Authorization callback URL:  http://localhost:8080/login/oauth2/code/github
GITHUB_CLIENT_ID=<your-github-client-id>
GITHUB_CLIENT_SECRET=<your-github-client-secret>

# --- JWT ---------------------------------------------------------------------
# The key is decoded as Base64 by JwtService, and must be at least 32 bytes long.
# Generate one with:   openssl rand -base64 32
JWT_SECRET_KEY=<base64-string-from-the-command-above>
# Token lifetime in milliseconds: 86400000 = 1 day, 3600000 = 1 hour
JWT_EXPIRATION=86400000

# --- ADMIN ACCOUNT -----------------------------------------------------------
# DatabaseSeeder creates this ADMIN user at startup, but only if no user
# with this email exists yet. Use a strong password.
ADMIN_USERNAME=<admin-username>
ADMIN_EMAIL=<admin@example.com>
ADMIN_PASSWORD=<a-strong-password>

# --- CLOUDINARY --------------------------------------------------------------
# Cloudinary dashboard > Settings > API Keys
# Format: cloudinary://<api_key>:<api_secret>@<cloud_name>
CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name>
