spring.application.name=backend

# 1. LOAD THE SECRET FILE
# Loads application-secret.properties (git-ignored). Every ${...} placeholder below
# is resolved from that file, or from an environment variable with the same name.
spring.profiles.include=secret

# 2. DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 3. HIBERNATE
# "update" creates/alters tables automatically: fine for development.
# For production prefer "validate" together with a migration tool (Flyway / Liquibase).
spring.jpa.hibernate.ddl-auto=update
# Prints every SQL query: useful while developing, noisy otherwise.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. GOOGLE OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# 5. GITHUB OAUTH2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# 6. JWT
# Base64-encoded key, at least 32 bytes (generate with: openssl rand -base64 32)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# Token lifetime in milliseconds (86400000 = 1 day)
application.security.jwt.expiration=${JWT_EXPIRATION}

# 7. ADMIN ACCOUNT (created at startup by DatabaseSeeder if it does not exist)
application.admin.username=${ADMIN_USERNAME}
application.admin.password=${ADMIN_PASSWORD}
application.admin.email=${ADMIN_EMAIL}

# 8. CLOUDINARY
cloudinary.url=${CLOUDINARY_URL}

# 9. UPLOAD LIMITS
# Maximum size of a single file
spring.servlet.multipart.max-file-size=100MB
# Maximum size of the whole request (all files of one post together)
spring.servlet.multipart.max-request-size=100MB
